[project]
name = "manfriday-backend"
version = "0.1.0"
description = "Mac-hosted backend for the Man Friday Android-first MVP."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "pydantic-settings>=2.7.0,<3.0.0",
  "uvicorn[standard]>=0.34.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0,<1.0.0",
  "pytest>=8.3.0,<9.0.0",
  "ruff>=0.8.0,<1.0.0",
]

[project.scripts]
manfriday = "manfriday.cli:main"
manfriday-backend = "manfriday.api.main:main"
manfriday-agent = "manfriday.voice_agent.main:main"
manfriday-voice-smoke = "manfriday.voice_agent.smoke:main"
manfriday-phase5-failure-smoke = "manfriday.phase5_failure_smoke:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
